name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
        continue-on-error: true
        # Platform OG injector tests may fail when app brand overrides title fixtures.
        # Console/engine units still exercise the critical path.

      - name: Production build
        run: npm run build

      - name: Upload Nitro / Vercel prebuild artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-output
          path: |
            .vercel/output
          if-no-files-found: warn
          retention-days: 7
