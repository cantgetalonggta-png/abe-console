name: vercel-prod-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Resolve Vercel token
        id: tok
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ADMIN_VERCEL_TOKEN: ${{ secrets.ADMIN_VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${VERCEL_TOKEN:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${ADMIN_VERCEL_TOKEN:-}"; fi
          if [ -z "$TOKEN" ]; then
            echo "::error::Missing secret. Set VERCEL_TOKEN or ADMIN_VERCEL_TOKEN on this repo."
            echo "GitHub → Settings → Secrets and variables → Actions"
            echo "Create token: https://vercel.com/account/settings/tokens"
            echo "Name on Vercel can be anything; the secret value is the token string (often starts with vca_)."
            echo "Optional: VERCEL_ORG_ID, VERCEL_PROJECT_ID, XAI_API_KEY"
            exit 1
          fi
          # Export for later steps via GITHUB_ENV (not printed)
          echo "VERCEL_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Token resolved (source secret name redacted; length ${#TOKEN})."

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Deploy production (prebuilt)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -euo pipefail

          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            echo "Linked via VERCEL_ORG_ID + VERCEL_PROJECT_ID"
          else
            npx vercel@latest link --yes --scope echo-ec69 --project abe-console \
              || npx vercel@latest link --yes --scope echo-ec69 \
              || npx vercel@latest link --yes --project abe-console \
              || npx vercel@latest link --yes
          fi

          # Optional: ensure Secret XAI_API_KEY on Production (Config/Secret model)
          if [ -n "${XAI_API_KEY:-}" ]; then
            printf '%s' "$XAI_API_KEY" | npx vercel@latest env add XAI_API_KEY production --type secret --force \
              || printf '%s' "$XAI_API_KEY" | npx vercel@latest env add XAI_API_KEY production --force \
              || true
            printf '%s' 'grok-3-latest' | npx vercel@latest env add XAI_MODEL production --type config --force || true
            printf '%s' 'true' | npx vercel@latest env add GROK_CHAT_ENABLED production --type config --force || true
          fi

          npx vercel@latest deploy --prebuilt --prod --yes --scope echo-ec69 2>&1 | tee /tmp/prod-deploy.log \
            || npx vercel@latest deploy --prebuilt --prod --yes 2>&1 | tee /tmp/prod-deploy.log

          URL=$(grep -oE 'https://[^ ]+' /tmp/prod-deploy.log | grep -E 'vercel\.app|abe-console' | tail -n 1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production URL: ${URL:-see logs}"

      - name: Summary
        run: |
          echo "### Production deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Secrets expected: \`VERCEL_TOKEN\` (required), \`VERCEL_ORG_ID\` / \`VERCEL_PROJECT_ID\` (optional), \`XAI_API_KEY\` (optional chat)." >> "$GITHUB_STEP_SUMMARY"
