name: vercel-prod-deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Require VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret missing on this repo."
            echo "Add it at: Settings → Secrets → Actions → VERCEL_TOKEN"
            echo "Create token: https://vercel.com/account/settings/tokens"
            exit 1
          fi
          echo "VERCEL_TOKEN present (value redacted)."
      - run: npm ci
      - run: npm run build
      - name: Link + deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -e
          npx vercel@latest pull --yes --environment=production || true
          if [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "Using org/project env link"
          else
            npx vercel@latest link --yes --project abe-console || npx vercel@latest link --yes
          fi
          # set XAI if provided as secret
          if [ -n "${{ secrets.XAI_API_KEY }}" ]; then
            printf '%s' "${{ secrets.XAI_API_KEY }}" | npx vercel@latest env add XAI_API_KEY production --force || true
          fi
          npx vercel@latest deploy --prebuilt --prod --yes
